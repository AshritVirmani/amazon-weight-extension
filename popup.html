<!DOCTYPE html>
<html>
<head>
  <title>Weight Filler</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 15px;
      text-align: center;
      background-color: #f3f3f3;
    }
    h3 {
      margin-top: 0;
      color: #111;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      background-color: #f0c14b;
      border: 1px solid #a88734;
      border-radius: 8px;
      color: #111;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #e4b33b;
    }
    button.secondary {
      background-color: #ff6b6b;
      border: 1px solid #d63031;
      margin-top: 10px;
    }
    button.secondary:hover {
      background-color: #ee5a6f;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
      color: #333;
    }
  </style>
</head>
<body>
  <h3>Amazon Weight & Dimensions</h3>
  <button id="fillWeightsBtn">Fill Weights & Dimensions</button>
  <button id="highlightAnomaliesBtn" class="secondary">Highlight Anomalies</button>
  <button id="highlightAnomaliesOrdersBtn" class="secondary">Highlight Anomalies (Orders Page)</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
